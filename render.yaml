# render.yaml - For Auto-Deploy
services:
  - name: quant-bot
    github:
      repo: mindovermatterr69/QUANT-BOT
      branch: main
      deployOnPush: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    plan: free